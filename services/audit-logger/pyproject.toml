[project]
name = "audit-logger"
version = "0.1.0"
description = "Append-only audit logger service."
requires-python = ">=3.11"
dependencies = [
  "contracts",
  "fastapi>=0.115.0",
  "sqlalchemy>=2.0.39",
  "uvicorn>=0.34.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/audit_logger"]
