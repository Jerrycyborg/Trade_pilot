[project]
name = "autonomy-orchestrator"
version = "0.1.0"
description = "Autonomous trading orchestration service."
requires-python = ">=3.11"
dependencies = [
  "contracts",
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "uvicorn>=0.34.0",
  "apscheduler>=3.10.0",
  "pyyaml>=6.0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autonomy_orchestrator"]
