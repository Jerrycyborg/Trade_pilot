[project]
name = "backtest-service"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "contracts",
  "market_data",
  "fastapi>=0.115.0",
  "uvicorn>=0.34.0",
  "pandas>=2.0.0",
  "numpy>=1.26.0,<2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/backtest_service"]
