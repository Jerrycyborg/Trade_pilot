[project]
name = "notification-service"
version = "0.1.0"
description = "Notification service with webhook support."
requires-python = ">=3.11"
dependencies = [
  "contracts",
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "uvicorn>=0.34.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notification_service"]
