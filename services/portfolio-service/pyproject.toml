[project]
name = "portfolio-service"
version = "0.1.0"
description = "Portfolio reconciliation service derived from execution fills."
requires-python = ">=3.11"
dependencies = [
  "contracts",
  "fastapi>=0.115.0",
  "sqlalchemy>=2.0.39",
  "psycopg[binary]>=3.2.0",
  "uvicorn>=0.34.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/portfolio_service"]
