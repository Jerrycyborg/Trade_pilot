[project]
name = "approval-gateway"
version = "0.1.0"
description = "Human approval gateway for review decisions."
requires-python = ">=3.11"
dependencies = [
  "contracts",
  "fastapi>=0.115.0",
  "sqlalchemy>=2.0.39",
  "uvicorn>=0.34.0",
  "pyyaml>=6.0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/approval_gateway"]
