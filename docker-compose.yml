# The full stack, on shared PostgreSQL state.
#
# Previously this defined six services and omitted the autonomy orchestrator —
# the main loop — so the composed stack could not actually trade. Every service
# is now represented, and the ones holding authoritative state point at the
# same database rather than at their own SQLite files.
#
# Real-money execution is off here and cannot be turned on by this file:
# BROKER=paper, and the live-mode switch lives in the database as an audited
# row that an operator has to set.

x-common-env: &common-env
  # The shared lifecycle authority. Every service that can place or gate an
  # order reads the roster from here, so they cannot disagree about what is
  # permitted to trade.
  LIFECYCLE_DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/trading_stack
  TRADING_ACCOUNT_ID: default
  # Compose may select the internal simulator or a broker-hosted paper venue.
  # ALPACA_PAPER is deliberately forced true here: this stack is incapable of
  # turning BROKER=alpaca into a real-money client through environment changes.
  BROKER: ${BROKER:-paper}
  ALPACA_PAPER: "true"
  ALPACA_API_KEY: ${ALPACA_API_KEY:-}
  ALPACA_SECRET_KEY: ${ALPACA_SECRET_KEY:-}
  ALPACA_FEED: ${ALPACA_FEED:-iex}

  # Explicit pass-through. Compose reads .env for interpolation but env_file
  # points at the public template; without these mappings, setting intraday
  # values in .env changed Compose itself and never changed any container.
  TRADING_LOOP_OWNER: ${TRADING_LOOP_OWNER:-orchestrator}
  MARKET_DATA_PROVIDER: ${MARKET_DATA_PROVIDER:-yahoo}
  MARKET_DATA_TIMEFRAME: ${MARKET_DATA_TIMEFRAME:-daily}
  INTRADAY_MINUTES: ${INTRADAY_MINUTES:-15}
  INTRADAY_LOOKBACK_DAYS: ${INTRADAY_LOOKBACK_DAYS:-5}
  STREAMING_ENABLED: ${STREAMING_ENABLED:-false}
  STREAM_SYMBOLS: ${STREAM_SYMBOLS:-}
  STREAM_SYMBOL_LIMIT: ${STREAM_SYMBOL_LIMIT:-30}
  ORCHESTRATOR_INTERVAL_SECONDS: ${ORCHESTRATOR_INTERVAL_SECONDS:-300}
  STOP_LOSS_CHECK_INTERVAL_SECONDS: ${STOP_LOSS_CHECK_INTERVAL_SECONDS:-}
  TAKE_PROFIT_CHECK_INTERVAL_SECONDS: ${TAKE_PROFIT_CHECK_INTERVAL_SECONDS:-}
  INTRADAY_EXECUTION_PRICE_MAX_AGE_SECONDS: ${INTRADAY_EXECUTION_PRICE_MAX_AGE_SECONDS:-5}
  INTRADAY_USE_AI: ${INTRADAY_USE_AI:-false}
  POLICY_MAX_DATA_AGE_SECONDS: ${POLICY_MAX_DATA_AGE_SECONDS:-30}
  APP_ENV: production
  ALLOW_INSECURE_DEV_AUTH: "false"
  INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY is required}
  ADMIN_API_KEY: ${ADMIN_API_KEY:?ADMIN_API_KEY is required}
  PROMPT_REGISTRY_PATH: /app/config/prompts
  RESEARCH_PROMPT_SHA256: af48b3b97e0f7ef550d49b19e9280262140fca56d524a8d02506202173b5587b
  STRATEGY_PROMPT_SHA256: 55bcc291b4324a60b4548a32c35019affbead82c0d8bd602a993de27fa8a603c
  LEARNING_ENABLED: "true"
  LEARNING_STRATEGY_REGISTRY_PATH: /app/config/strategies
  LEARNING_STRATEGY_SHA256: bc90c2ecf0a1d753e3ac77adca93f8263f239f8cb4be1108eed2efd84062e25f
  JOURNAL_PATH: /var/lib/trade-pilot/journal.db
  PAPER_STATE_PATH: /var/lib/trade-pilot/paper-broker-state.json
  PDT_STATE_PATH: /var/lib/trade-pilot/day-trade-state.json
  STOP_LOSS_STATE_PATH: /var/lib/trade-pilot/stop-loss-state.json
  TAKE_PROFIT_STATE_PATH: /var/lib/trade-pilot/take-profit-state.json

services:
  postgres:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    environment:
      POSTGRES_DB: trading_stack
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # Everything else waits on this: a service that starts before the
      # database is ready fails its first lifecycle read and, by design,
      # refuses to trade.
      test: ["CMD-SHELL", "pg_isready -U postgres -d trading_stack"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Applies the additive lifecycle migrations, then exits. Everything that
  # needs the schema waits for it to complete successfully.
  migrate:
    build:
      context: .
      dockerfile: services/policy-service/Dockerfile
    environment:
      LIFECYCLE_DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/trading_stack
    command: ["uv", "run", "python", "tools/migrate.py", "up"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  policy-service:
    build:
      context: .
      dockerfile: services/policy-service/Dockerfile
    env_file: [.env.example]
    environment:
      <<: *common-env
      POLICY_DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/trading_stack
    depends_on:
      migrate: {condition: service_completed_successfully}
    ports: ["127.0.0.1:8001:8001"]

  execution-service:
    build:
      context: .
      dockerfile: services/execution-service/Dockerfile
    env_file: [.env.example]
    environment:
      <<: *common-env
      EXECUTION_DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/trading_stack
    depends_on:
      migrate: {condition: service_completed_successfully}
    ports: ["127.0.0.1:8002:8002"]
    healthcheck:
      # `compose up --wait` waits for *healthy*, and without this it waits only
      # for *running* — which for a uvicorn container means the process has
      # been created, not that it is accepting connections. CI's first request
      # arrived in the same second the container started and got
      # connection-refused.
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8002/health')\""]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    volumes:
      - journal-data:/var/lib/trade-pilot

  strategy-service:
    build:
      context: .
      dockerfile: services/strategy-service/Dockerfile
    env_file: [.env.example]
    environment:
      <<: *common-env
      STRATEGY_DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/trading_stack
    depends_on:
      migrate: {condition: service_completed_successfully}
    ports: ["127.0.0.1:8003:8003"]
    volumes:
      - journal-data:/var/lib/trade-pilot

  portfolio-service:
    build:
      context: .
      dockerfile: services/portfolio-service/Dockerfile
    env_file: [.env.example]
    environment:
      <<: *common-env
      PORTFOLIO_DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/trading_stack
      PORTFOLIO_EXECUTION_DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/trading_stack
    depends_on:
      migrate: {condition: service_completed_successfully}
    ports: ["127.0.0.1:8004:8004"]

  research-service:
    build:
      context: .
      dockerfile: services/research-service/Dockerfile
    env_file: [.env.example]
    environment:
      <<: *common-env
      RESEARCH_DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/trading_stack
    depends_on:
      migrate: {condition: service_completed_successfully}
    ports: ["127.0.0.1:8005:8005"]
    volumes:
      - journal-data:/var/lib/trade-pilot

  audit-logger:
    build:
      context: .
      dockerfile: services/audit-logger/Dockerfile
    env_file: [.env.example]
    environment:
      <<: *common-env
      AUDIT_DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/trading_stack
    depends_on:
      migrate: {condition: service_completed_successfully}
    ports: ["127.0.0.1:8006:8006"]

  # The main loop. Absent from this file before, which meant the documented
  # stack could be started and would never place an order.
  autonomy-orchestrator:
    build:
      context: .
      dockerfile: services/autonomy-orchestrator/Dockerfile
    env_file: [.env.example]
    environment:
      <<: *common-env
      EXECUTION_SERVICE_URL: http://execution-service:8002
      POLICY_SERVICE_URL: http://policy-service:8001
      PORTFOLIO_SERVICE_URL: http://portfolio-service:8004
      STRATEGY_SERVICE_URL: http://strategy-service:8003
      AUDIT_SERVICE_URL: http://audit-logger:8006
      NOTIFICATION_SERVICE_URL: http://notification-service:8009
      APPROVAL_SERVICE_URL: http://approval-gateway:8010
    depends_on:
      migrate: {condition: service_completed_successfully}
      execution-service: {condition: service_started}
      policy-service: {condition: service_started}
    ports: ["127.0.0.1:8007:8007"]
    volumes:
      - journal-data:/var/lib/trade-pilot

  sentiment-aggregator:
    build:
      context: .
      dockerfile: services/sentiment-aggregator/Dockerfile
    env_file: [.env.example]
    environment: *common-env
    depends_on:
      migrate: {condition: service_completed_successfully}
    ports: ["127.0.0.1:8008:8008"]

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    env_file: [.env.example]
    environment: *common-env
    depends_on:
      migrate: {condition: service_completed_successfully}
    ports: ["127.0.0.1:8009:8009"]

  approval-gateway:
    build:
      context: .
      dockerfile: services/approval-gateway/Dockerfile
    env_file: [.env.example]
    environment:
      <<: *common-env
      APPROVAL_DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/trading_stack
    depends_on:
      migrate: {condition: service_completed_successfully}
    ports: ["127.0.0.1:8010:8010"]

  backtest-service:
    build:
      context: .
      dockerfile: services/backtest-service/Dockerfile
    env_file: [.env.example]
    environment: *common-env
    depends_on:
      migrate: {condition: service_completed_successfully}
    ports: ["127.0.0.1:8011:8011"]
    volumes:
      - journal-data:/var/lib/trade-pilot

volumes:
  postgres-data:
  journal-data:
