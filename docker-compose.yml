services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: trading_stack
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  policy-service:
    build:
      context: .
      dockerfile: services/policy-service/Dockerfile
    env_file:
      - .env.example
    environment:
      POLICY_DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/trading_stack
    depends_on:
      - postgres
    ports:
      - "8001:8001"

  execution-service:
    build:
      context: .
      dockerfile: services/execution-service/Dockerfile
    env_file:
      - .env.example
    environment:
      EXECUTION_DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/trading_stack
    depends_on:
      - postgres
    ports:
      - "8002:8002"

  portfolio-service:
    build:
      context: .
      dockerfile: services/portfolio-service/Dockerfile
    env_file:
      - .env.example
    environment:
      PORTFOLIO_DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/trading_stack
      PORTFOLIO_EXECUTION_DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/trading_stack
    depends_on:
      - postgres
    ports:
      - "8004:8004"

  strategy-service:
    build:
      context: .
      dockerfile: services/strategy-service/Dockerfile
    ports:
      - "8003:8003"

volumes:
  postgres-data:
