[project]
name = "trading-stack"
version = "0.1.0"
description = "Milestone 1 bootstrap for a production-minded AI trading stack."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "contracts",
  "journal",
  "market_data",
  "brokers",
  "audit-logger",
  "autonomy-orchestrator",
  "execution-service",
  "notification-service",
  "portfolio-service",
  "policy-service",
  "approval-gateway",
  "sentiment-aggregator",
  "strategy-service",
  "research-service",
  "backtest-service",
]

[dependency-groups]
dev = [
  "httpx>=0.28.0",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.11.0",
]

[tool.uv.workspace]
members = [
  "libs/contracts",
  "libs/journal",
  "libs/market_data",
  "libs/brokers",
  "services/audit-logger",
  "services/autonomy-orchestrator",
  "services/execution-service",
  "services/notification-service",
  "services/portfolio-service",
  "services/policy-service",
  "services/approval-gateway",
  "services/sentiment-aggregator",
  "services/strategy-service",
  "services/research-service",
  "services/backtest-service",
]

[tool.uv.sources]
contracts = { workspace = true }
journal = { workspace = true }
market_data = { workspace = true }
brokers = { workspace = true }
audit-logger = { workspace = true }
autonomy-orchestrator = { workspace = true }
execution-service = { workspace = true }
notification-service = { workspace = true }
portfolio-service = { workspace = true }
policy-service = { workspace = true }
approval-gateway = { workspace = true }
sentiment-aggregator = { workspace = true }
strategy-service = { workspace = true }
research-service = { workspace = true }
backtest-service = { workspace = true }

[tool.pytest.ini_options]
# services/*/tests were never collected, so the backtest engine's tests had
# never run. Both roots are collected now.
testpaths = ["tests", "services/backtest-service/tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
