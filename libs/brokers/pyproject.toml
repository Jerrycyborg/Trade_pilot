[project]
name = "brokers"
version = "0.1.0"
description = "Broker adapters: PaperBroker and AlpacaBroker."
requires-python = ">=3.11"
dependencies = [
    "contracts",
    "alpaca-py>=0.38.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brokers"]
