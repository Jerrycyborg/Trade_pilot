[project]
name = "specialists"
version = "0.1.0"
description = "L1: typed specialist roles producing structured assessments from the point-in-time archive."
requires-python = ">=3.11"
dependencies = ["journal", "market_data", "attribution"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/specialists"]
