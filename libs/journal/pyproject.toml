[project]
name = "journal"
version = "0.1.0"
description = "Point-in-time market data archive and decision journal."
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0.39",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/journal"]
