[project]
name = "veto"
version = "0.1.0"
description = "L2: an independent risk veto with authority to reject and none to approve."
requires-python = ">=3.11"
dependencies = ["journal"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/veto"]
