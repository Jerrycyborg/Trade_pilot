[project]
name = "attribution"
version = "0.1.0"
description = "Post-trade attribution and counterfactuals over the point-in-time archive."
requires-python = ">=3.11"
dependencies = ["journal", "market_data"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/attribution"]
