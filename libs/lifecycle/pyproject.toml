[project]
name = "lifecycle"
version = "0.1.0"
description = "Strategy lifecycle roster: what is permitted to trade, and why."
requires-python = ">=3.11"
dependencies = [
    "attribution",
    "journal",
    "pydantic>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lifecycle"]
